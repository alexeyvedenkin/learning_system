name: Django CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --no-root

    - name: Run Flake8
      run: poetry run flake8 .


  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 11111
          POSTGRES_DB: learning_system
        ports:
          - 5432:5432

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in to Docker hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }} .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up SSH for GitHub
        run: |
          eval "$(ssh-agent -s)" # Запускаем SSH-агент
          echo "${{ secrets.SSH_KEY_FOR_GITHUB }}" | tr -d '\r' | ssh-add - # Добавляем ваш GitHub ключ

      - name: Set up SSH for server
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_NAME }}@${{ secrets.SERVER_IP }} << 'EOF'
            # Добавление ключа хоста репозитория в known_hosts
            ssh-keyscan github.com >> ~/.ssh/known_hosts
          
            sudo mkdir -p /home/***/learning_system  # Создает директорию с правами суперпользователя
            sudo chown $USER:$USER /home/***/learning_system  # Изменяем владельца на текущего пользователя
            cd /home/***/learning_system || exit 1    # Переход в директорию
            if [ ! -d ".git" ]; then  # Проверка, является ли это Git репозиторием
              # Если .git не найден, клонируем репозиторий
              git clone git@github.com:alexeyvedenkin/learning_system.git .  # Замените <URL_вашего_репозитория> на ваш URL
            else
              echo "Репозиторий уже клонирован. Выполняем git pull."
            fi

            GIT_SSH_COMMAND="ssh -v" git pull || exit 1  # Выводить подробную информацию для отладки
          
          # Показать подробное сообщение об ошибке
            GIT_SSH_COMMAND="ssh -v" git pull || exit 1  # Выводить подробную информацию для отладки
            
            git pull || exit 1               # Выходить при ошибке выполнения
      
            [ -f docker-compose.yml ] || { echo "docker-compose.yml not found!"; exit 1; }
          EOF
          
            cat > .env << 'ENV_EOF'
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DEBUG=${{ secrets.DEBUG }}
          POSTGRES_DB=learning_system
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=11111
          DATABASE_HOST=db
          REDIS_HOST=redis
          CELERY_BROKER_URL=redis://redis:6379
          CELERY_RESULT_BACKEND=redis://redis:6379
          IMAGE_TAG=${{ github.sha }}
          DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}
          ENV_EOF
            echo "✅ .env file created:"
            cat .env
            sudo docker compose -f docker-compose.yml down --remove-orphans
            sudo docker rm -f drf_course_project-redis-1 drf_course_project-db-1 2>/dev/null || true
            sudo docker compose -f docker-compose.yml --env-file .env up -d --build --force-recreate --remove-orphans
            sleep 15
            sudo docker compose ps
            sudo docker compose logs --tail=20
            sudo docker exec -i drf_course_project-db-1 psql -U postgres -c "SELECT 1 FROM pg_database WHERE datname = 'test_db'" | grep -q 1 || \
            sudo docker exec -i drf_course_project-db-1 psql -U postgres -c "CREATE DATABASE test_db;"
            sleep 10
            sudo docker compose -f docker-compose.yml --env-file .env exec web python manage.py migrate
            sudo docker ps -a
            sudo docker compose logs web
            sudo docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            sudo docker compose logs web --tail=10
          EOF
