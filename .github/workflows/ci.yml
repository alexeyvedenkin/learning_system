name: Django CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --no-root

    - name: Run Flake8
      run: poetry run flake8 .

  build:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in to Docker hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }} .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_NAME }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd ~/learning_system
            git pull
            cat > .env << 'ENV_EOF'
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DEBUG=${{ secrets.DEBUG }}
          POSTGRES_DB=test_db
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          DATABASE_HOST=db
          REDIS_HOST=redis
          CELERY_BROKER_URL=redis://redis:6379
          CELERY_RESULT_BACKEND=redis://redis:6379
          IMAGE_TAG=${{ github.sha }}
          DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}
          BOT_TOKEN=${{ secrets.BOT_TOKEN }}
          ENV_EOF
            echo "✅ .env file created:"
            cat .env
            sudo docker compose -f docker-compose.yml down --remove-orphans
            sudo docker rm -f drf_course_project-redis-1 drf_course_project-db-1 2>/dev/null || true
            sudo docker compose -f docker-compose.yml --env-file .env up -d --build --force-recreate --remove-orphans
            sleep 15
            sudo docker compose ps
            sudo docker compose logs --tail=20
            sudo docker exec -i drf_course_project-db-1 psql -U postgres -c "SELECT 1 FROM pg_database WHERE datname = 'test_db'" | grep -q 1 || \
            sudo docker exec -i drf_course_project-db-1 psql -U postgres -c "CREATE DATABASE test_db;"
            sleep 10
            sudo docker compose -f docker-compose.yml --env-file .env exec web python manage.py migrate
            sudo docker ps -a
            sudo docker compose logs web
            sudo docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            sudo docker compose logs web --tail=10
          EOF
