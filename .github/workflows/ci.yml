name: Django CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --no-root

    - name: Run Flake8
      run: poetry run flake8 .

  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      db: # Указываем сервис
        image: postgres:latest  # Используем образ PostgreSQL
        ports:
          - 5432:5432  # Пробрасываем порт
        env: # Указываем переменные окружения
          POSTGRES_DB: db
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        options: --health-cmd "pg_isready" --health-interval 10s --health-timeout 5s --health-retries 3

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --no-root

      - name: Run migrations
        env: # Определяем переменные окружения
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          USER: ${{ secrets.POSTGRES_USER }}  # Добавляем переменную USER
          PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}  # Добавляем переменную PASSWORD
        run: poetry run python manage.py migrate

      - name: Run tests
        env: # Определяем переменные окружения
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          USER: ${{ secrets.POSTGRES_USER }}  # Добавляем переменную USER
          PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}  # Добавляем переменную PASSWORD
        run: poetry run python manage.py test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in to Docker hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }} .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up SSH for GitHub
        run: |
          eval "$(ssh-agent -s)"  # Запускаем SSH-агент
          echo "${{ secrets.SSH_KEY_FOR_GITHUB }}" | tr -d '\r' | ssh-add -  # Добавляем ваш GitHub ключ
      
      - name: Deploy to Server
        run: |
          # Подключаемся к серверу и выполняем команды
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_NAME }}@${{ secrets.SERVER_IP }} << 'EOF'
            eval "$(ssh-agent -s)"  # Запускаем SSH-агент на сервере
            
            # Добавьте ключ для SSH, если он необходим
            ssh-add ~/.ssh/alex-v  # Замените на ваш ключ, если нужно
            
            ssh-keyscan github.com >> ~/.ssh/known_hosts  # Добавление ключа хоста репозитория
            
            # Проверка на наличие Git репозитория
            if [ ! -d "/home/***/learning_system/.git" ]; then  # Обратите внимание на путь
              git clone git@github.com:alexeyvedenkin/learning_system.git /home/***/learning_system  # Клонируем репозиторий
            else
              cd /home/***/learning_system && git pull  # Переходим и обновляем репозиторий
            fi
          EOF
