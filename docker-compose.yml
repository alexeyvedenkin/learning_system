version: '3.12'

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
      - static_volume:/code/static
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5

  db:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:6.3
    ports:
      - "6379:6379"
    depends_on:
      - web
    env_file:
      - ./.env

  celery:
    image: celery:5.5.3
    command: celery -A config worker --loglevel=info  # Команда для запуска worker
    depends_on:
      - redis
    env_file:
      - ./.env

  celery-beat:
    image: django-celery-beat:2.8.1
    command: celery -A config beat --loglevel=info  # Команда для запуска beat
    depends_on:
      - celery
    env_file:
      - ./.env

volumes:
  postgres_data:
  static_volume: